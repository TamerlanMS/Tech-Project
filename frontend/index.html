<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // тема применяется до первого рендера — без «вспышки» светлого фона
      try {
        var m = localStorage.getItem('org-users.theme') || 'system';
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C8431A'/%3E%3Cpath d='M9 22V10h3l4 6 4-6h3v12' stroke='white' stroke-width='2.6' fill='none'/%3E%3C/svg%3E" />
    <title>Пользователи организации</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
